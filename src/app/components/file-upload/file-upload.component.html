<div class="upload-section">
  <div class="col-4">
    <label class="btn btn-default p-0">
      <input type="file" (change)="selectFile($event)" />
    </label>
  </div>

  <div class="col-4">
    <button class="btn btn-success btn-sm" [disabled]="!currentFile" (click)="upload()">
      Upload
    </button>
  </div>
</div>

  <div class="trades-panel">
    <div class="button-panel">
      <a routerLink="/file-upload" routerLinkActive="router-link-active" #rla="routerLinkActive">ALL</a>
      <a routerLink="/file-upload" routerLinkActive="router-link-active" #rla="routerLinkActive">TRADER1</a>
      <a routerLink="/file-upload" routerLinkActive="router-link-active" #rla="routerLinkActive">TRADER2</a>
      <a routerLink="/file-upload" routerLinkActive="router-link-active" #rla="routerLinkActive">BUY</a>
      <a routerLink="/file-upload" routerLinkActive="router-link-active" #rla="routerLinkActive">SELL</a>
      <!-- Add more buttons as needed -->
    </div>
    <ag-grid-angular
      style="width: 100%; height: 512px;"
      class="ag-theme-quartz"
      [columnDefs]="columnDefs"
      [rowData]="rowData"
      [pagination]="true"
      [paginationPageSize]="10"
      [defaultColDef]="defaultColDef"
      [enableAdvancedFilter]="true"
      [rowModelType]="'serverSide'"
      (gridReady)="onGridReady($event)"
    ></ag-grid-angular>
  </div>

@if (progress) {
<div class="progress my-3">
  <div
    class="progress-bar progress-bar-info"
    role="progressbar"
    attr.aria-valuenow="{{ progress }}"
    aria-valuemin="0"
    aria-valuemax="100"
    [ngStyle]="{ width: progress + '%' }"
  >
    {{ progress }}%
  </div>
</div>
}

@if (message) {
<div class="alert alert-secondary" role="alert">{{ message }}</div>
}

<div class="card mt-3">
  <div class="card-header">List of Files</div>
  <ul class="list-group list-group-flush">
    @for (file of fileInfos | async; track file.name) {
    <li class="list-group-item">
      <a href="{{ file.url }}">{{ file.name }}</a>
    </li>
    }
  </ul>
</div>
